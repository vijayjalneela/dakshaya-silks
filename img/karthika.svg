<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 345" preserveAspectRatio="xMidYMax slice">
<!-- Karthigai Deepam, Kanjivaram colours: rani-pink and saffron sky, peacock-blue Arunachala with the Maha Deepam, painted gopuram, coloured kolam, rows of agal vilakku -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF3E2" stop-opacity="0"/>
    <stop offset=".22" stop-color="#FFD9A0" stop-opacity=".9"/>
    <stop offset=".5" stop-color="#FF9E4A"/>
    <stop offset=".75" stop-color="#F0457A"/>
    <stop offset="1" stop-color="#B0146A"/>
  </linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14808A"/><stop offset=".6" stop-color="#0E5C78"/><stop offset="1" stop-color="#173A6A"/></linearGradient>
  <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E9E5B"/><stop offset="1" stop-color="#1A6E45"/></linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A0F4E"/><stop offset="1" stop-color="#4A0838"/></linearGradient>
  <radialGradient id="maha" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFFBE0"/><stop offset=".22" stop-color="#FFE14A"/><stop offset=".55" stop-color="#FF9A1A" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFF6B8"/><stop offset=".4" stop-color="#FFC233" stop-opacity=".6"/><stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
  </radialGradient>
  <g id="diya">
    <circle cx="0" cy="-9" r="14" fill="url(#glow)"/>
    <path d="M-9 0 Q0 9 9 0 Q4 -3 0 -3 Q-4 -3 -9 0Z" fill="#E0702A"/>
    <path d="M-9 0 Q0 4 9 0" fill="none" stroke="#FFD24A" stroke-width="1.2"/>
    <path class="fl" d="M0 -14 Q3.8 -8 0 -3.5 Q-3.8 -8 0 -14Z" fill="#FFA800"/>
    <path class="fl" d="M0 -11 Q1.9 -7.5 0 -5 Q-1.9 -7.5 0 -11Z" fill="#FFF8C8"/>
  </g>
  <style>
    .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flk 1.5s ease-in-out infinite alternate}
    .mh{transform-box:fill-box;transform-origin:50% 100%;animation:flk 2.2s ease-in-out infinite alternate}
    .tw{animation:tw 2.8s ease-in-out infinite alternate}
    @keyframes flk{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.14) scaleX(.88)}}
    @keyframes tw{from{opacity:.35}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.fl,.mh,.tw{animation:none}}
  </style>
</defs>

<rect width="1200" height="345" fill="url(#sky)"/>
<!-- stars -->
<g fill="#FFFFFF"><circle class="tw" cx="150" cy="96" r="2"/><circle class="tw" cx="260" cy="70" r="1.5" style="animation-delay:.8s"/><circle class="tw" cx="1060" cy="84" r="2" style="animation-delay:1.2s"/><circle class="tw" cx="940" cy="62" r="1.5" style="animation-delay:.4s"/><circle class="tw" cx="380" cy="104" r="1.4" style="animation-delay:1.6s"/><circle class="tw" cx="820" cy="100" r="1.4" style="animation-delay:2s"/></g>
<!-- full moon of Karthika Pournami -->
<circle cx="1010" cy="138" r="46" fill="#FFF3D6" opacity=".22"/><circle cx="1010" cy="138" r="28" fill="#FFF8E6"/>

<!-- side hills, Arunachala in peacock blue with the Maha Deepam -->
<path d="M0 300 Q130 236 300 252 Q420 262 520 300Z M680 300 Q800 254 950 250 Q1100 248 1200 278 V300Z" fill="url(#hill2)"/>
<path d="M150 300 Q310 232 440 162 Q525 114 600 98 Q680 116 780 170 Q900 238 1060 300Z" fill="url(#hill)"/>
<path d="M440 162 Q525 114 600 98 Q680 116 780 170" fill="none" stroke="#3FC1C9" stroke-width="3" opacity=".6"/>
<circle cx="600" cy="84" r="78" fill="url(#maha)"/>
<path d="M584 98 L588 88 H612 L616 98Z" fill="#C9962E"/><rect x="586" y="86" width="28" height="4" rx="2" fill="#FFD24A"/>
<path class="mh" d="M600 40 Q618 66 608 88 H592 Q582 66 600 40Z" fill="#FF9A00"/>
<path class="mh" d="M600 54 Q609 70 604 88 H596 Q591 70 600 54Z" fill="#FFE14A"/>
<path class="mh" d="M600 66 Q604 76 601 88 H599 Q596 76 600 66Z" fill="#FFFBE0"/>

<!-- painted gopuram: every tier a different Kanjivaram colour, gold kalasams -->
<g transform="translate(600 300)">
  <path d="M-66 0 V-30 H66 V0Z" fill="#F7E2B0"/>
  <path d="M-66 -30 H66 V-26 H-66Z" fill="#E91E63"/>
  <path d="M-58 -30 L-50 -58 H50 L58 -30Z" fill="#00A3A3"/>
  <path d="M-50 -58 L-42 -84 H42 L50 -58Z" fill="#FFB300"/>
  <path d="M-42 -84 L-34 -106 H34 L42 -84Z" fill="#E91E63"/>
  <path d="M-34 -106 L-26 -124 H26 L34 -106Z" fill="#43A047"/>
  <path d="M-28 -124 Q0 -146 28 -124Z" fill="#FF7043"/>
  <g fill="#FFD24A" stroke="#B8862B" stroke-width=".8"><path d="M-16 -134 l-3 -8 h6Z"/><path d="M0 -142 l-3.5 -10 h7Z"/><path d="M16 -134 l-3 -8 h6Z"/>
    <circle cx="-16" cy="-143" r="2.6"/><circle cx="0" cy="-153" r="3"/><circle cx="16" cy="-143" r="2.6"/></g>
  <g stroke="#FFFFFF" stroke-width="1.4" opacity=".75"><path d="M-58 -30 H58 M-50 -58 H50 M-42 -84 H42 M-34 -106 H34"/></g>
  <!-- little painted figures/niches -->
  <g fill="#FFFFFF" opacity=".85">
    <rect x="-40" y="-52" width="8" height="16" rx="4"/><rect x="-16" y="-52" width="8" height="16" rx="4"/><rect x="8" y="-52" width="8" height="16" rx="4"/><rect x="32" y="-52" width="8" height="16" rx="4"/>
    <rect x="-28" y="-79" width="7" height="14" rx="3.5"/><rect x="-3.5" y="-79" width="7" height="14" rx="3.5"/><rect x="21" y="-79" width="7" height="14" rx="3.5"/>
    <rect x="-17" y="-102" width="6" height="12" rx="3"/><rect x="11" y="-102" width="6" height="12" rx="3"/>
  </g>
  <g fill="#E91E63"><circle cx="-36" cy="-46" r="2"/><circle cx="-12" cy="-46" r="2"/><circle cx="12" cy="-46" r="2"/><circle cx="36" cy="-46" r="2"/></g>
  <g fill="#1E88E5"><circle cx="-24.5" cy="-74" r="1.8"/><circle cx="0" cy="-74" r="1.8"/><circle cx="24.5" cy="-74" r="1.8"/></g>
  <path d="M-15 0 V-20 Q0 -32 15 -20 V0Z" fill="#7A1F2E"/><path d="M-15 -20 Q0 -32 15 -20" fill="none" stroke="#FFD24A" stroke-width="2"/>
  <!-- mango-leaf thoranam on the gate -->
  <g fill="#2E9E3A"><path d="M-14 -22 l2 7 l2 -7Z"/><path d="M-8 -25 l2 7 l2 -7Z"/><path d="M-2 -27 l2 7 l2 -7Z"/><path d="M4 -25 l2 7 l2 -7Z"/><path d="M10 -22 l2 7 l2 -7Z"/></g>
</g>

<!-- ground in rani pink with rows of lamps -->
<path d="M0 286 Q600 270 1200 286 V345 H0Z" fill="url(#ground)"/>
<path d="M0 290 Q600 274 1200 290" fill="none" stroke="#FFD24A" stroke-width="2.5"/>
<path d="M0 296 Q600 280 1200 296" fill="none" stroke="#FFD24A" stroke-width="1" stroke-dasharray="4 6"/>
<g>
  <use href="#diya" x="40" y="292"/><use href="#diya" x="90" y="290"/><use href="#diya" x="140" y="288"/><use href="#diya" x="190" y="286"/><use href="#diya" x="240" y="285"/><use href="#diya" x="290" y="284"/><use href="#diya" x="340" y="283"/><use href="#diya" x="390" y="282"/><use href="#diya" x="440" y="281"/><use href="#diya" x="490" y="280"/>
  <use href="#diya" x="710" y="280"/><use href="#diya" x="760" y="281"/><use href="#diya" x="810" y="282"/><use href="#diya" x="860" y="283"/><use href="#diya" x="910" y="284"/><use href="#diya" x="960" y="285"/><use href="#diya" x="1010" y="286"/><use href="#diya" x="1060" y="288"/><use href="#diya" x="1110" y="290"/><use href="#diya" x="1160" y="292"/>
  <use href="#diya" x="20" y="318"/><use href="#diya" x="75" y="316"/><use href="#diya" x="130" y="315"/><use href="#diya" x="185" y="314"/><use href="#diya" x="240" y="313"/><use href="#diya" x="295" y="312"/><use href="#diya" x="350" y="311"/><use href="#diya" x="405" y="310"/>
  <use href="#diya" x="795" y="310"/><use href="#diya" x="850" y="311"/><use href="#diya" x="905" y="312"/><use href="#diya" x="960" y="313"/><use href="#diya" x="1015" y="314"/><use href="#diya" x="1070" y="315"/><use href="#diya" x="1125" y="316"/><use href="#diya" x="1180" y="318"/>
</g>
<!-- coloured kolam (seen at an angle) -->
<g transform="translate(600 320) scale(1 .24)">
  <circle r="124" fill="#FFFFFF" opacity=".12"/>
  <g fill="#FFD24A"><path d="M0 -20 Q16 -50 0 -78 Q-16 -50 0 -20Z" transform="rotate(0)"/><path d="M0 -20 Q16 -50 0 -78 Q-16 -50 0 -20Z" transform="rotate(90)"/><path d="M0 -20 Q16 -50 0 -78 Q-16 -50 0 -20Z" transform="rotate(180)"/><path d="M0 -20 Q16 -50 0 -78 Q-16 -50 0 -20Z" transform="rotate(270)"/></g>
  <g fill="#00BFA5"><path d="M0 -20 Q16 -50 0 -78 Q-16 -50 0 -20Z" transform="rotate(45)"/><path d="M0 -20 Q16 -50 0 -78 Q-16 -50 0 -20Z" transform="rotate(135)"/><path d="M0 -20 Q16 -50 0 -78 Q-16 -50 0 -20Z" transform="rotate(225)"/><path d="M0 -20 Q16 -50 0 -78 Q-16 -50 0 -20Z" transform="rotate(315)"/></g>
  <circle r="20" fill="#FF7043"/><circle r="9" fill="#FFFFFF"/>
  <circle r="98" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
  <path d="M-124 0 Q-112 -60 -58 -94 Q0 -128 58 -94 Q112 -60 124 0 Q112 60 58 94 Q0 128 -58 94 Q-112 60 -124 0Z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
</g>
<use href="#diya" x="600" y="326"/><use href="#diya" x="515" y="324"/><use href="#diya" x="685" y="324"/><use href="#diya" x="560" y="334"/><use href="#diya" x="640" y="334"/>
</svg>
